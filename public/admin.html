<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KJ Shop Admin Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
    }

    /* NAVBAR */

    nav{
      background:#131921;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    nav .left{
      display:flex;
      gap:20px;
      align-items:center;
    }

    nav h2{
      color:#ff9900;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    nav a:hover{
      color:#ff9900;
    }

    nav button{
      background:#ff9900;
      border:none;
      padding:10px 15px;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }

    nav button:hover{
      background:#e68a00;
    }

    /* CONTAINER */

    .container{
      padding:30px;
    }

    .welcome{
      margin-bottom:20px;
    }

    .welcome h1{
      color:#333;
      margin-bottom:10px;
    }

    .welcome p{
      color:#666;
    }

    /* STATS */

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-top:30px;
      margin-bottom:30px;
    }

    .stat-card{
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .stat-card:hover{
      transform:translateY(-5px);
    }

    .stat-card h2{
      font-size:35px;
      color:#ff9900;
      margin-bottom:10px;
    }

    .stat-card p{
      color:#555;
      font-size:18px;
    }

    /* SEARCH */

    .search-box{
      margin-bottom:20px;
    }

    .search-box input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:1px solid #ccc;
      outline:none;
      font-size:16px;
    }

    /* TABLE */

    .table-container{
      overflow-x:auto;
      background:white;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      padding:20px;
      margin-bottom:30px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    thead{
      background:#131921;
      color:white;
    }

    th, td{
      padding:15px;
      text-align:left;
    }

    tbody tr{
      border-bottom:1px solid #ddd;
    }

    tbody tr:hover{
      background:#f9f9f9;
    }

    .product-img{
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:10px;
    }

    .edit-btn{
      background:orange;
      border:none;
      padding:8px 12px;
      color:white;
      border-radius:5px;
      cursor:pointer;
      margin-right:5px;
    }

    .delete-btn{
      background:red;
      border:none;
      padding:8px 12px;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .edit-btn:hover{
      background:#cc8400;
    }

    .delete-btn:hover{
      background:darkred;
    }

    .role-badge{
      padding:6px 12px;
      border-radius:20px;
      color:white;
      font-size:14px;
      font-weight:bold;
    }

    .admin-role{
      background:#ff9900;
    }

    .user-role{
      background:#131921;
    }

    /* MOBILE */

    @media(max-width:768px){

      nav{
        padding:15px;
      }

      .container{
        padding:15px;
      }

      th, td{
        font-size:14px;
      }

    }

  </style>

</head>

<body>

<script>

const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user || !token) {
  alert("Please login first");
  window.location.href = "login.html";
}

if (user.role !== "admin") {
  alert("Access denied: Admin only");
  window.location.href = "index.html";
}

</script>

<!-- NAVBAR -->

<nav>

  <div class="left">

    <h2>KJ Admin</h2>

    <a href="index.html">Store</a>
    <a href="add.html">Add Product</a>

  </div>

  <button onclick="logout()">
    Logout
  </button>

</nav>

<!-- MAIN -->

<div class="container">

  <!-- WELCOME -->

  <div class="welcome">

    <h1>Admin Dashboard</h1>

    <p>
      Welcome Admin:
      <strong id="email"></strong>
    </p>

  </div>

  <!-- STATS -->

  <div id="stats" class="stats"></div>

  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search products..."
      onkeyup="searchProducts()"
    >

  </div>

  <!-- PRODUCTS TABLE -->

  <div class="table-container">

    <h2 style="margin-bottom:20px;">Products</h2>

    <table>

      <thead>

        <tr>

          <th>Image</th>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="table"></tbody>

    </table>

  </div>

  <!-- USERS TABLE -->

  <div class="table-container">

    <h2 style="margin-bottom:20px;">Registered Users</h2>

    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Email</th>
          <th>Role</th>

        </tr>

      </thead>

      <tbody id="usersTable"></tbody>

    </table>

  </div>

</div>

<script>

const API = "http://localhost:3000/products";

document.getElementById("email").innerText =
  user.email;

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  try {

    const res = await fetch(API);
    const data = await res.json();

    document.getElementById("table").innerHTML =
      data.map(p => `

      <tr>

        <td>

          <img
            src="${
              p.image
              ? "http://localhost:3000" + p.image
              : "https://via.placeholder.com/70"
            }"
            class="product-img"
          >

        </td>

        <td>${p.id}</td>

        <td>${p.name}</td>

        <td>${p.price} RWF</td>

        <td>${p.quantity}</td>

        <td>

          <button
            class="edit-btn"
            onclick="editProduct(${p.id})"
          >
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct(${p.id})"
          >
            Delete
          </button>

        </td>

      </tr>

    `).join("");

  } catch (error) {

    alert("Failed to load products");

  }

}

/* =========================
   LOAD STATS
========================= */

async function loadStats() {

  try {

    const res =
      await fetch("http://localhost:3000/stats");

    const data = await res.json();

    document.getElementById("stats").innerHTML = `

      <div class="stat-card">
        <h2>${data.products}</h2>
        <p>📦 Products</p>
      </div>

      <div class="stat-card">
        <h2>${data.users}</h2>
        <p>👤 Users</p>
      </div>

      <div class="stat-card">
        <h2>${data.orders}</h2>
        <p>🛒 Orders</p>
      </div>

    `;

  } catch (error) {

    console.log(error);

  }

}

/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

  try {

    const res =
      await fetch("http://localhost:3000/users");

    const users = await res.json();

    document.getElementById("usersTable").innerHTML =
      users.map(u => `

      <tr>

        <td>${u.id}</td>

        <td>${u.email}</td>

        <td>

          <span class="
            role-badge
            ${u.role === "admin"
              ? "admin-role"
              : "user-role"}
          ">
            ${u.role}
          </span>

        </td>

      </tr>

    `).join("");

  } catch (error) {

    console.log(error);

  }

}

/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  const confirmDelete =
    confirm("Delete this product?");

  if (!confirmDelete) return;

  await fetch(`${API}/${id}`, {
    method:"DELETE"
  });

  alert("Product deleted");

  loadProducts();
  loadStats();

}

/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

  window.location.href =
    `edit.html?id=${id}`;

}

/* =========================
   SEARCH PRODUCTS
========================= */

function searchProducts() {

  const value =
    document.getElementById("search")
    .value
    .toLowerCase();

  const rows =
    document.querySelectorAll("#table tr");

  rows.forEach(row => {

    const text =
      row.innerText.toLowerCase();

    row.style.display =
      text.includes(value)
      ? ""
      : "none";

  });

}

/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem("user");
  localStorage.removeItem("token");

  window.location.href =
    "login.html";

}

/* =========================
   START
========================= */

loadProducts();
loadStats();
loadUsers();

</script>

</body>
</html>
