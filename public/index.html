<!DOCTYPE html>
<html>
<head>
  <title>KJ Shop</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      background: white;
    }

    button {
      padding: 8px 12px;
      margin-top: 5px;
      cursor: pointer;
    }

    .update { background: orange; color: white; }
    .delete { background: red; color: white; }
  </style>
</head>

<body>

<!-- LOGIN PROTECTION -->
<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user || !token) {
  alert("Please login first");
  window.location.href = "login.html";
}
</script>

<!-- NAVBAR -->
<nav>
  <a href="index.html">Home</a>
  <a href="cart.html">Cart</a>
  <span id="adminLinks"></span>
  <button onclick="logout()">Logout</button>
</nav>

<!-- MAIN -->
<div class="container">

  <marquee><h1>🛒 KJ Shop</h1></marquee>

  <p>Welcome: <span id="username"></span></p>

  <div id="products" class="product-grid"></div>

</div>

<script>
const API = "http://localhost:3000/products";

document.getElementById("username").innerText = user.email;

/* ADMIN LINKS */
if (user.role === "admin") {
  document.getElementById("adminLinks").innerHTML = `
    <a href="add.html">Add Product</a>
    <a href="admin.html">Dashboard</a>
  `;
}

/* LOAD PRODUCTS */
async function loadProducts() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    document.getElementById("products").innerHTML = data.map(p => `

      <div class="card">
        <img src="${p.image
  ? (p.image.startsWith('http')
      ? p.image
      : 'http://localhost:3000' + p.image)
  : 'http://localhost:3000/uploads/sung.jpeg'}"
  class="product-img">
        <h3>${p.name}</h3>
        <p>💰 Price: ${p.price} RWF</p>
        <p>📦 Quantity: ${p.quantity}</p>

        <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
          Add to Cart
        </button>
        

        ${user.role === "admin" ? `
          <br><br>

          <a href="edit.html?id=${p.id}">
            <button class="update">Update</button>
          </a>

          <button onclick="deleteProduct(${p.id})" class="delete">
            Delete
          </button>
        ` : ""}

      </div>

    `).join("");

  } catch (error) {
    alert("Failed to load products");
  }
}

/* ADD TO CART */
function addToCart(id, name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ id, name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart 🛒");
}

/* DELETE PRODUCT */
async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  await fetch(`${API}/${id}`, {
    method: "DELETE"
  });

  alert("Product deleted");
  loadProducts();
}

/* LOGOUT */
function logout() {
  localStorage.removeItem("user");
  localStorage.removeItem("token");
  localStorage.removeItem("cart");
  window.location.href = "login.html";
}

loadProducts();
</script>

</body>
</html>
