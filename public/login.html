<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>KJ Shop - Login</title>

  <link rel="stylesheet" href="style.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(rgba(0,0,0,0.6),
      rgba(0,0,0,0.6)),
      url("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1600&auto=format&fit=crop");
      background-size:cover;
      background-position:center;
    }

    .login-container{
      width:380px;
      background:white;
      padding:40px;
      border-radius:15px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo h1{
      color:#ff9900;
      font-size:35px;
    }

    .logo p{
      color:gray;
      margin-top:5px;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#333;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:16px;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#ff9900;
      box-shadow:0 0 5px rgba(255,153,0,0.5);
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      background:#ff9900;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#e68a00;
      transform:scale(1.02);
    }

    .bottom-text{
      text-align:center;
      margin-top:20px;
      color:#555;
    }

    .bottom-text a{
      color:#ff9900;
      text-decoration:none;
      font-weight:bold;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    .loader{
      display:none;
      text-align:center;
      margin-top:15px;
      color:#ff9900;
      font-weight:bold;
    }

    @media(max-width:500px){
      .login-container{
        width:90%;
        padding:30px 20px;
      }
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="logo">
    <h1>KJ Shop</h1>
    <p>Welcome Back 👋</p>
  </div>

  <div class="input-group">
    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >
  </div>

  <div class="input-group">
    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >
  </div>

  <button onclick="login()" class="login-btn">
    Login
  </button>

  <div class="loader" id="loader">
    Logging in...
  </div>

  <div class="bottom-text">
    Don't have an account?
    <a href="register.html">Register</a>
  </div>

</div>

<script>
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please fill all fields");
    return;
  }

  document.getElementById("loader").style.display = "block";

  try {

    const res = await fetch("http://localhost:3000/login", {
      method: "POST",
      headers: {
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await res.json();

    document.getElementById("loader").style.display = "none";

    if (data.error) {

      alert(data.error);

    } else {

      localStorage.setItem(
        "user",
        JSON.stringify(data.user)
      );

      localStorage.setItem(
        "token",
        data.token
      );

      alert("Login successful 🎉");

      window.location.href = "index.html";
    }

  } catch (error) {

    document.getElementById("loader").style.display = "none";

    alert("Server connection failed");
  }
}
</script>

</body>
</html>
